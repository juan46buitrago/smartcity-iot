proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se sobrescribe (no se concatena): la cabecera que envíe el cliente no debe llegar al backend,
# o podría falsear su IP y esquivar los límites de intentos.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Red interna de Docker: si no conecta en 2 s, el servicio está caído.
proxy_connect_timeout 2s;
