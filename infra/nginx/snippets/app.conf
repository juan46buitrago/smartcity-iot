# Configuración de la aplicación (común a HTTP local y HTTPS de producción). Se incluye dentro de un bloque server.
server_tokens off;
client_max_body_size 64k;

# Resolución diferida (DNS de Docker): Nginx arranca aunque algún servicio no esté disponible.
resolver 127.0.0.11 valid=30s ipv6=off;
set $backend http://backend:3000;
set $grafana http://grafana:3000;
set $nodered http://nodered:1880;

root /usr/share/nginx/html;
index index.html;

# Cabeceras de seguridad comunes
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsts always;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# ---------- Fallos del gateway ----------
# Solo cubren los errores que genera Nginx: las respuestas 5xx del backend (proxy_intercept_errors off) pasan intactas.
location @api_502 {
  default_type application/json;
  return 502 '{"error":"El servicio no está disponible en este momento. Inténtalo de nuevo en unos segundos."}';
}
location @api_504 {
  default_type application/json;
  return 504 '{"error":"El servidor tardó demasiado en responder. Inténtalo de nuevo en unos segundos."}';
}
location @tool_down {
  default_type text/html;
  charset utf-8;
  return 503 '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicio no disponible</title><body style="font-family:system-ui;background:#0b1110;color:#e8efec;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center"><main><h1 style="font-size:22px">Esta herramienta no está disponible ahora</h1><p>El resto de la plataforma sigue funcionando. Inténtalo de nuevo en unos minutos.</p><p><a style="color:#7fe3a8" href="/">Volver al panel</a></p></main></body></html>';
}

# ---------- API REST ----------
location = /api/auth/login {
  limit_req zone=login burst=5 nodelay;
  proxy_pass $backend;
  proxy_read_timeout 30s;
  error_page 502 = @api_502;
  error_page 504 = @api_504;
  include /etc/nginx/snippets/proxy.conf;
}
# Una respuesta del asistente puede encadenar varias llamadas al modelo.
location /api/ai/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass $backend;
  proxy_read_timeout 65s;
  error_page 502 = @api_502;
  error_page 504 = @api_504;
  include /etc/nginx/snippets/proxy.conf;
}
location /api/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass $backend;
  # Mayor que el límite de consulta a InfluxDB (20 s); un backend colgado no retiene al usuario 60 s.
  proxy_read_timeout 30s;
  error_page 502 = @api_502;
  error_page 504 = @api_504;
  include /etc/nginx/snippets/proxy.conf;
}

# ---------- WebSocket (solo lectura) ----------
location = /ws {
  proxy_pass $backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  include /etc/nginx/snippets/proxy.conf;
}

# ---------- Grafana (con su propio inicio de sesión) ----------
location = /grafana/login {
  limit_req zone=login burst=5 nodelay;
  proxy_pass $grafana;
  error_page 502 504 = @tool_down;
  include /etc/nginx/snippets/proxy.conf;
}
location /grafana/ {
  proxy_pass $grafana;
  error_page 502 504 = @tool_down;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  include /etc/nginx/snippets/proxy.conf;
}

# ---------- Node-RED (editor protegido con usuario/contraseña) ----------
location = /nodered/auth/token {
  limit_req zone=login burst=5 nodelay;
  proxy_pass $nodered;
  error_page 502 504 = @tool_down;
  include /etc/nginx/snippets/proxy.conf;
}
location /nodered/ {
  proxy_pass $nodered;
  error_page 502 504 = @tool_down;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  include /etc/nginx/snippets/proxy.conf;
}

# ---------- Aplicación web (SPA) ----------
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security $hsts always;
  try_files $uri =404;
}
location / {
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security $hsts always;
  add_header Cache-Control "no-cache";
  try_files $uri /index.html;
}
