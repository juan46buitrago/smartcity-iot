# Mosquitto — SmartCityBGA
# Sin acceso anónimo; usuarios y contraseñas se generan al arrancar desde variables de entorno
# (ver docker-entrypoint.sh). El listener 1883 NO se expone a Internet: solo red interna de Docker
# (y 127.0.0.1 en desarrollo local). En producción se añade un listener TLS 8883 para dispositivos
# externos (DEV11, ESP32), con las mismas credenciales por dispositivo y ACL.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0
protocol mqtt

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Límites para proteger la VM
max_queued_messages 5000
max_inflight_messages 50
message_size_limit 65536
max_keepalive 120

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Listener TLS 8883 (solo producción): lo genera docker-entrypoint.sh en /mosquitto/run/conf.d si hay
# certificado; en local el directorio queda vacío. Va al final: las opciones de listener afectan al último declarado.
include_dir /mosquitto/run/conf.d
