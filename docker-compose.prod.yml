# SmartCityBGA — producción (VM de Azure). Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Solo Nginx publica puertos web (80/443) y Mosquitto el 8883 (MQTT sobre TLS, solo dispositivos externos). Mosquitto, InfluxDB, Node-RED, Grafana y el backend quedan
# en la red interna de Docker. Node-RED y Grafana se sirven por Nginx (/nodered/, /grafana/) con su login.
services:
  web:
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # Broker MQTT con TLS para dispositivos externos (DEV11, ESP32). El volumen de Let's Encrypt se monta solo
  # lectura; el entrypoint copia certificado y clave a un directorio propio de mosquitto. El 1883 sigue interno.
  # Tras renovar el certificado (cada ~60 días) el entrypoint pide recarga (SIGHUP); si no basta:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml restart mosquitto
  mosquitto:
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    ports:
      - "8883:8883"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro

  # Renovación automática del certificado (webroot). La emisión inicial la hace infra/scripts/deploy-tls.sh.
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [iot]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    mem_limit: 128m

  grafana:
    environment:
      GF_SERVER_DOMAIN: ${PUBLIC_DOMAIN:?}
      GF_SERVER_ROOT_URL: "https://${PUBLIC_DOMAIN}/grafana/"
      GF_SECURITY_COOKIE_SECURE: "true"

volumes:
  letsencrypt:
  certbot-www:
